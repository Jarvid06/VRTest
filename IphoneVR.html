<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
		<title>IphoneVR</title>
		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: white;
	background-color: black;
	overflow: hidden;
	touch-action: none;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

#status, #status-splash, #status-progress {
	position: absolute;
	left: 0;
	right: 0;
}

#status, #status-splash {
	top: 0;
	bottom: 0;
}

#status {
	background-color: #242424;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
}

#status-splash {
	max-height: 100%;
	max-width: 100%;
	margin: auto;
}

#status-splash.show-image--false {
	display: none;
}

#status-splash.fullsize--true {
	height: 100%;
	width: 100%;
	object-fit: contain;
}

#status-splash.use-filter--false {
	image-rendering: pixelated;
}

#status-progress, #status-notice {
	display: none;
}

#status-progress {
	bottom: 10%;
	width: 50%;
	margin: 0 auto;
}

#status-notice {
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	line-height: 1.3;
	margin: 0 2rem;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	z-index: 1;
}
		</style>
		<link id="-gd-engine-icon" rel="icon" type="image/png" href="IphoneVR.icon.png" />
<link rel="apple-touch-icon" href="IphoneVR.apple-touch-icon.png"/>
<style>
  /* Ensure canvas fills the screen completely */
  html, body, #canvas {
    width: 100% !important;
    height: 100% !important;
    margin: 0;
    padding: 0;
    overflow: hidden;
    background-color: #000;
  }
  /* Overlay that prompts the player to turn their phone */
  #rotate-device-overlay {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    background: #000000;
    color: #ffffff;
    z-index: 999999;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  /* Automatically show overlay when the iPhone is held vertically */
  @media screen and (orientation: portrait) {
    #rotate-device-overlay {
      display: flex;
    }
  }
</style>
<script>
  // Global object to store orientation values so Godot can read them
  window.deviceOrientationData = {
    alpha: 0,
    beta: 0,
    gamma: 0,
    screenAngle: 0,
    granted: false
  };

  // Global object to store hand tracking results so Godot can read them
  window.handTrackingData = {
    hands: [],   // array of hands, each an array of 21 {x, y, z} points (normalized 0-1)
    ready: false
  };

  var _handLandmarker = null;
  var _handVideo = null;

  // 1. Force web page into full screen mode on user tap
  var el = document.documentElement;
  if (el.requestFullscreen) {
    el.requestFullscreen().catch(function(e){});
  } else if (el.webkitRequestFullscreen) { /* iOS Safari support */
    el.webkitRequestFullscreen();
  }

  // Call this from a Godot button press: JavaScriptBridge.eval("requestPermissionsAndStart()")
  // iOS requires a user tap to grant BOTH motion and camera permission, so ask for
  // both from the same gesture instead of two separate buttons.
  function requestPermissionsAndStart() {
    requestiOSOrientationPermission();
    startHandTracking();
  }

  function requestiOSOrientationPermission() {
    if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
      DeviceOrientationEvent.requestPermission()
        .then(permissionState => {
          if (permissionState === 'granted') {
            window.deviceOrientationData.granted = true;
            window.addEventListener('deviceorientation', handleOrientation);
          } else {
            alert('Permission to access device orientation was denied.');
          }
        })
        .catch(console.error);
    } else {
      window.deviceOrientationData.granted = true;
      window.addEventListener('deviceorientation', handleOrientation);
    }
  }

  function handleOrientation(event) {
    window.deviceOrientationData.alpha = event.alpha || 0;
    window.deviceOrientationData.beta = event.beta || 0;
    window.deviceOrientationData.gamma = event.gamma || 0;
    window.deviceOrientationData.screenAngle =
      (screen.orientation && screen.orientation.angle) || window.orientation || 0;
  }

  // 2. Hand tracking, via Google's prebuilt MediaPipe web bundle.
  // Dynamic import() keeps this a plain script — no type="module" needed.
  async function startHandTracking() {
    try {
      const { HandLandmarker, FilesetResolver } = await import(
        "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3"
      );

      const filesetResolver = await FilesetResolver.forVisionTasks(
        "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3/wasm"
      );

      _handLandmarker = await HandLandmarker.createFromOptions(filesetResolver, {
        baseOptions: {
          modelAssetPath: "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task",
          delegate: "GPU"
        },
        runningMode: "VIDEO",
        numHands: 2
      });

      const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } });
      _handVideo = document.createElement("video");
      _handVideo.srcObject = stream;
      _handVideo.playsInline = true;
      await _handVideo.play();

      window.handTrackingData.ready = true;
      requestAnimationFrame(handDetectLoop);
    } catch (e) {
      console.error("Hand tracking failed to start:", e);
    }
  }

  function handDetectLoop() {
    if (_handLandmarker && _handVideo && _handVideo.readyState >= 2) {
      const result = _handLandmarker.detectForVideo(_handVideo, performance.now());
      window.handTrackingData.hands = result.landmarks;
    }
    requestAnimationFrame(handDetectLoop);
  }
</script>
	</head>
	<body>
		<canvas id="canvas">
			Your browser does not support the canvas tag.
		</canvas>

		<noscript>
			Your browser does not support JavaScript.
		</noscript>

		<div id="status">
			<img id="status-splash" class="show-image--true fullsize--true use-filter--true" src="IphoneVR.png" alt="">
			<progress id="status-progress"></progress>
			<div id="status-notice"></div>
		</div>

		<script src="IphoneVR.js"></script>
		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"IphoneVR","experimentalVK":false,"fileSizes":{"IphoneVR.pck":99652,"IphoneVR.wasm":1508102},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
				}
			},
		}).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());
		</script>
	</body>
</html>
